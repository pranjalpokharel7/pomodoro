<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="stylesheet/theme.css?v=8">
  <link rel="stylesheet" href="stylesheet/base.css?v=8">
  <link rel="stylesheet" href="stylesheet/buttons.css?v=8">
  <link rel="stylesheet" href="stylesheet/stats.css?v=8">
  <link rel="stylesheet" href="stylesheet/timer.css?v=8">
  <link rel="stylesheet" href="stylesheet/radio.css?v=8">
  <link rel="stylesheet" href="stylesheet/settings.css?v=8">
  <link rel="stylesheet" href="stylesheet/quotes.css?v=8">
</head>
<body data-mode="focus" class="locked">
  <form id="gate" class="gate">
    <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <button id="signin" class="primary">Sign in</button>
  </form>

  <div class="corner">
    <button id="motivate" class="round" title="Motivate me" aria-label="Show a motivational quote">✨</button>
    <details class="settings">
      <summary title="Settings" aria-label="Settings">⚙️</summary>
      <div class="panel">
        <label>Focus <input type="number" id="focusMin" min="1" max="180" value="25"> min</label>
        <label>Short break <input type="number" id="shortMin" min="1" max="60" value="5"> min</label>
        <label>Long break <input type="number" id="longMin" min="1" max="120" value="15"> min</label>
      </div>
    </details>
  </div>

  <button id="signout" class="round signout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>

  <section id="lb" class="lb">
    <header>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <button id="boardclose" class="icon" title="Close leaderboard" aria-label="Close leaderboard">✕</button>
    </header>
    <p id="board" class="board"></p>
  </section>
  <button id="boardbtn" class="round boardbtn" title="Leaderboard" aria-label="Leaderboard"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></button>
  <main>
    <header class="total">
      <div class="stat">
        <p>Total studied</p>
        <div class="row">
          <h2 id="total">00:00:00</h2>
          <button id="clear" class="icon" title="Clear total and sessions" aria-label="Clear total and sessions">🗑️</button>
        </div>
      </div>
      <div class="stat">
        <p>Sessions</p>
        <div class="row"><h2 id="sessions">0</h2></div>
      </div>
    </header>

    <div class="modes">
      <button data-mode="focus" class="active">Focus</button>
      <button data-mode="short">Short break</button>
      <button data-mode="long">Long break</button>
    </div>

    <div class="timer">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54"></circle>
        <circle id="ring" cx="60" cy="60" r="54"></circle>
      </svg>
      <div id="time">25:00</div>
    </div>

    <div class="controls">
      <button id="toggle" class="primary">Start</button>
      <button id="reset">Reset</button>
      <button id="skip" hidden>Skip break</button>
    </div>

    <div class="music">
      <button id="music" aria-label="Play lofi radio" title="Play lofi"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" aria-label="Volume">
    </div>
    <div class="music">
      <select id="station" aria-label="Radio station">
        <option value="groovesalad">Groove Salad · chill downtempo</option>
        <option value="fluid">Fluid · instrumental hip-hop</option>
        <option value="lush">Lush · soft vocals</option>
        <option value="synphaera">Synphaera · calm ambient</option>
        <option value="deepspaceone">Deep Space One · deep ambient</option>
        <option value="dronezone">Drone Zone · atmospheric</option>
        <option value="beatblender">Beat Blender · electronic</option>
        <option value="chillits">Chillits Radio · chill, live</option>
        <option value="darkzone">The Dark Zone · ambient</option>
        <option value="doomed">Doomed · ambient, industrial</option>
        <option value="dz2">Drone Zone 2 · ambient</option>
        <option value="groovesalad2">Groove Salad 2 · ambient, electronic</option>
        <option value="gsclassic">Groove Salad Classic · ambient, electronic</option>
        <option value="missioncontrol">Mission Control · ambient, electronic</option>
        <option value="n5md">n5MD Radio · specials</option>
        <option value="sf1033">SF 10-33 · ambient, news</option>
        <option value="spacestation">Space Station Soma · electronic</option>
      </select>
    </div>
    <p class="credit">Streamed from <a href="https://somafm.com" target="_blank" rel="noopener">SomaFM</a></p>
  </main>
  <p id="quote" class="quote" role="status" aria-live="polite"></p>
  <script src="scripts/common.js?v=8"></script>
  <script src="scripts/timer.js?v=8"></script>
  <script src="scripts/radio.js?v=8"></script>
  <script src="scripts/quotes.js?v=8"></script>
  <script src="scripts/settings.js?v=8"></script>
  <script src="scripts/profile.js?v=8"></script>
  <script src="scripts/main.js?v=8"></script>
</body>
</html>
