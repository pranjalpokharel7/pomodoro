<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="stylesheet/theme.css?v=26">
  <link rel="stylesheet" href="stylesheet/base.css?v=26">
  <link rel="stylesheet" href="stylesheet/buttons.css?v=26">
  <link rel="stylesheet" href="stylesheet/stats.css?v=26">
  <link rel="stylesheet" href="stylesheet/charts.css?v=26">
  <link rel="stylesheet" href="stylesheet/calendar.css?v=26">
  <link rel="stylesheet" href="stylesheet/dropdown.css?v=26">
  <link rel="stylesheet" href="stylesheet/timer.css?v=26">
  <link rel="stylesheet" href="stylesheet/radio.css?v=26">
  <link rel="stylesheet" href="stylesheet/settings.css?v=26">
  <link rel="stylesheet" href="stylesheet/quotes.css?v=26">
</head>
<body data-mode="focus" class="locked">
  <script>(function(){var t=localStorage.getItem('pomo-theme');if(t&&t!=='cozy')document.body.dataset.theme=t;})();</script>
  <form id="gate" class="gate">
    <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <button id="signin" class="primary">Sign in</button>
  </form>

  <div class="corner">
    <button id="motivate" class="round" title="Motivate me" aria-label="Show a motivational quote"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></button>
    <details class="settings">
      <summary title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></summary>
      <div class="panel">
        <label>Focus <input type="number" id="focusMin" min="1" max="180" value="25"> min</label>
        <label>Short break <input type="number" id="shortMin" min="1" max="60" value="5"> min</label>
        <label>Long break <input type="number" id="longMin" min="1" max="120" value="15"> min</label>
        <div class="theme-swatches">
          <button class="theme-swatch" data-theme="cozy" title="Cozy"></button>
          <button class="theme-swatch" data-theme="forest" title="Forest"></button>
          <button class="theme-swatch" data-theme="academia" title="Dark Academia"></button>
          <button class="theme-swatch" data-theme="fireplace" title="Fireplace"></button>
        </div>
      </div>
    </details>
  </div>

  <button id="signout" class="round signout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>

  <details id="lb" class="lb">
    <summary title="Leaderboard" aria-label="Leaderboard"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></summary>
    <div class="panel">
      <div id="lbtabs" class="lbtabs">
        <button data-range="today">Today</button>
        <button data-range="week">Week</button>
        <button data-range="all">All</button>
      </div>
      <div id="board" class="board"></div>
    </div>
  </details>

  <details id="stats" class="stats-card" name="bottom-panel">
    <summary title="Stats" aria-label="Stats"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></summary>
    <div class="panel">
      <select id="stats-user" class="themed">
        <option value="">My stats</option>
      </select>
      <p class="chart-title">Focus time</p>
      <div id="statstabs" class="lbtabs">
        <button data-srange="7">7 days</button>
        <button data-srange="30">30 days</button>
      </div>
      <div id="daily" class="daily"></div>
      <p class="chart-title">Hours <span class="datepick"><button type="button" id="hoursday" class="hoursday"></button><span id="cal" class="cal" hidden></span></span></p>
      <div id="hours" class="daily hours"></div>
      <p class="chart-title">By task</p>
      <div id="bytask" class="bytask"></div>
    </div>
  </details>
  <details id="histcard" class="stats-card hist" name="bottom-panel">
    <summary title="Recent sessions" aria-label="Recent sessions"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></summary>
    <div class="panel">
      <p class="chart-title">Recent sessions</p>
      <section id="history" class="history" aria-label="Recent focus sessions"></section>
    </div>
  </details>
  <main>
    <header class="total">
      <div class="stat">
        <p>Today</p>
        <div class="row">
          <h2 id="total">00:00:00</h2>
        </div>
      </div>
      <div class="stat">
        <p>Sessions</p>
        <div class="row"><h2 id="sessions">0</h2></div>
      </div>
    </header>

    <div class="modes">
      <button data-mode="focus" class="active">Focus</button>
      <button data-mode="short">Short break</button>
      <button data-mode="long">Long break</button>
    </div>

    <div class="timer">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54"></circle>
        <circle id="ring" cx="60" cy="60" r="54"></circle>
      </svg>
      <div id="time">25:00</div>
    </div>

    <select id="task" class="task" aria-label="Current focus task"></select>

    <div class="controls">
      <button id="toggle" class="primary">Start</button>
      <button id="reset">Reset</button>
      <button id="skip" hidden>Skip break</button>
    </div>

    <div class="music">
      <button id="music" aria-label="Play music" title="Play music"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" aria-label="Volume">
    </div>
    <div class="music">
      <select id="station" aria-label="Music"></select>
    </div>
    <div id="yt"></div>
    <p class="credit">Streamed from <a href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a></p>

  </main>
  <p id="quote" class="quote" role="status" aria-live="polite"></p>
  <script src="scripts/common.js?v=26"></script>
  <script src="scripts/timer.js?v=26"></script>
  <script src="scripts/tasks.js?v=26"></script>
  <script src="scripts/radio.js?v=26"></script>
  <script src="scripts/quotes.js?v=26"></script>
  <script src="scripts/settings.js?v=26"></script>
  <script src="scripts/profile.js?v=26"></script>
  <script src="scripts/dropdown.js?v=26"></script>
  <script src="scripts/stats.js?v=26"></script>
  <script src="scripts/calendar.js?v=26"></script>
  <script src="scripts/main.js?v=26"></script>
</body>
</html>
